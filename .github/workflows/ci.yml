name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: ./verify.sh
      - name: Installer smoke test
        run: |
          ./install.sh --name "CI User" --path "$RUNNER_TEMP/Second Brain" --language en
          test -f "$RUNNER_TEMP/Second Brain/.second-brain/config.json"

